name: .NET validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (.NET 10 / Windows)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore
        run: dotnet restore EasyWrite.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format EasyWrite.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build EasyWrite.slnx --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test EasyWrite.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=tests.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14
